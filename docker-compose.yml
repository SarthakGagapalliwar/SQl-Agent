services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sql-agent-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sqlagent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sql-agent-network

  # SQL Agent Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sql-agent-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database connection - uses internal docker network
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sqlagent}?sslmode=disable
      # Mistral AI API Key
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      # Next.js configuration
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sql-agent-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: sql-agent-adminer
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - sql-agent-network
    profiles:
      - tools

networks:
  sql-agent-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
